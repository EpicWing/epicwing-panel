name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Build
        run: |
          pkg="$(go list -f '{{if eq .Name "main"}}{{.ImportPath}}{{end}}' ./... | head -n1)"
          echo "main package: $pkg"
          version="${GITHUB_REF_NAME#v}"
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} \
            go build -trimpath -buildvcs=false \
            -ldflags="-s -w -buildid= -X main.version=${version}" \
            -o "epicwing-agent-linux-${{ matrix.goarch }}" "$pkg"
          sha256sum "epicwing-agent-linux-${{ matrix.goarch }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.goarch }}
          path: agent/epicwing-agent-linux-${{ matrix.goarch }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: agent
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          # The section "## 0.3.1-beta (date)" up to the next "## " heading.
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version " 'index($0, v) == 1 {on = 1; next} /^## / && on {exit} on' CHANGELOG.md \
            | sed '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # The release exists already (the tag was moved): replace the files and the notes.
            gh release upload "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
              --prerelease --notes-file notes.md
          fi
