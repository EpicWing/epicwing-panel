name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: EpicWing version
      description: Panel and agent version, for example v0.2.1-beta
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output from the panel or agent logs. Remove tokens and passwords first.
      render: shell
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Debian 13 or Ubuntu 24.04
