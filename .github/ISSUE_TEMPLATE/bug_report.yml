name: Bug report
description: Something does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The more details you give, the faster we can fix it.
        For questions, please use Discord instead (see the link on the previous page).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what you did and what went wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See the error
    validations:
      required: false
  - type: dropdown
    id: part
    attributes:
      label: Which part is affected?
      options:
        - Installer (install.sh)
        - Panel (website or backend)
        - Node agent
        - Documentation
        - I am not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag you installed, for example v0.1.4-beta.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system
      placeholder: Debian 13
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste the last lines of the logs that fit your problem.
        Installer: /var/log/epicwing-install.log
        Panel: journalctl -u epicwing-panel -n 100 --no-pager
        Agent: journalctl -u epicwing-agent -n 100 --no-pager
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you send
      options:
        - label: I removed passwords, tokens and private IP addresses from this report.
          required: true
